<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#090715" />
<title>UNO Table</title>
<meta name="description" content="สร้างห้อง แชร์ลิงก์ แล้วเล่น UNO กับเพื่อน" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23090715'/%3E%3Cpath d='M17 19h30v26H17z' fill='none' stroke='%2350e6ff' stroke-width='4'/%3E%3Cpath d='M24 32h16' stroke='%23ff54bd' stroke-width='4'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="scene">
    <div class="noise" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>UNO TABLE</div>
      <button class="quiet-button" id="motion-toggle" aria-pressed="false">ลดการเคลื่อนไหว</button>
    </header>

    <main class="app">

      <!-- ============================= HOME VIEW =============================
           Create a room, or join one by code. This is what a visitor sees
           when they land on the site with no room code in the URL. -->
      <section id="view-home" class="view">
        <h1>UNO Table</h1>
        <p class="subtitle">เล่น UNO ออนไลน์กับเพื่อน</p>

        <div class="card">
          <h2>สร้างห้อง</h2>
          <label for="create-name">ชื่อของคุณ</label>
          <input id="create-name" type="text" maxlength="20" placeholder="เช่น Alex" />
          <button id="btn-create-room" class="btn btn-primary">สร้างห้อง</button>
        </div>

        <div class="card">
          <h2>เข้าร่วมห้อง</h2>
          <label for="join-name">ชื่อของคุณ</label>
          <input id="join-name" type="text" maxlength="20" placeholder="เช่น Alex" />
          <label for="join-code">รหัสห้อง</label>
          <input id="join-code" type="text" maxlength="6" placeholder="เช่น ABC123" autocapitalize="characters" />
          <button id="btn-join-room" class="btn btn-secondary">เข้าร่วมห้อง</button>
        </div>

        <p id="home-error" class="error-message" hidden></p>
      </section>

      <!-- ============================= LOBBY VIEW =============================
           Shown after creating or joining a room. Lists everyone currently
           in the room and updates live as people join. -->
      <section id="view-lobby" class="view" hidden>
        <h1>ห้องรอ</h1>
        <div class="status"><span class="status-dot" aria-hidden="true"></span><span id="lobby-status">กำลังรอผู้เล่น&hellip;</span></div>

        <div class="card">
          <p class="label">รหัสห้อง</p>
          <p id="lobby-code" class="room-code"></p>
          <button id="btn-copy-link" class="btn btn-secondary">คัดลอกลิงก์เชิญ</button>
          <p id="copy-feedback" class="hint" hidden>คัดลอกลิงก์แล้ว!</p>
        </div>

        <div class="card">
          <p class="label"><span id="player-count">0</span>/<span id="player-max">8</span> ผู้เล่น</p>
          <ul id="player-list" class="player-list"></ul>
        </div>

        <p class="hint">กำลังรอโฮสต์เริ่มเกม&hellip;</p>
        <button id="btn-leave-room" class="btn btn-text">ออกจากห้อง</button>
      </section>

      <!-- ============================= ERROR VIEW =============================
           Shown for a bad/expired room link, instead of a blank or stuck
           screen. Always offers a way back to the home page. -->
      <section id="view-error" class="view" hidden>
        <h1>มีบางอย่างผิดพลาด</h1>
        <p id="error-message" class="error-message"></p>
        <a href="/" class="btn btn-primary">กลับหน้าแรก</a>
      </section>

    </main>
  </div>

  <!-- Supabase client library, vendored locally (v2.117.1) so the app
       doesn't depend on a CDN being reachable at runtime. -->
  <script src="vendor/supabase.js"></script>
  <script src="js/motion.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
